<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" height="260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0d111b" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Text Title Gradient -->
    <linearGradient id="text-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f1f5f9" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.15" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-purple" cx="85%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.05" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, Monaco, monospace; }
  </style>

  <!-- Base Card -->
  <rect width="1000" height="260" rx="16" fill="url(#bg-grad-dark)" />
  <rect width="1000" height="260" rx="16" fill="url(#grid-pattern)" />
  <rect width="1000" height="260" rx="16" fill="url(#glow-cyan)" />
  <rect width="1000" height="260" rx="16" fill="url(#glow-purple)" />
  <rect x="1" y="1" width="998" height="258" rx="15" fill="none" stroke="url(#border-grad-dark)" stroke-width="1.5" />

  <!-- Status Pill / Top Badge -->
  <g transform="translate(50, 36)">
    <rect width="215" height="26" rx="13" fill="url(#pill-grad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="15" cy="13" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" class="font-mono" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="0.5">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Location Badge -->
  <g transform="translate(278, 36)">
    <rect width="145" height="26" rx="13" fill="#1e293b" fill-opacity="0.5" stroke="#475569" stroke-width="0.75" stroke-opacity="0.6" />
    <text x="14" y="17" class="font-sans" font-size="11" font-weight="500" fill="#94a3b8">📍 Lahore, Pakistan</text>
  </g>

  <!-- Main Headline / Name -->
  <text x="50" y="108" class="font-sans" font-size="44" font-weight="800" fill="url(#text-grad-dark)" letter-spacing="-0.8">
    Qasim Amir
  </text>

  <!-- Subtitle -->
  <text x="50" y="142" class="font-sans" font-size="18" font-weight="600" fill="#e2e8f0" letter-spacing="-0.2">
    Machine Learning Engineer &amp; Full Stack Next.js Developer
  </text>

  <!-- Tagline / Mission -->
  <text x="50" y="172" class="font-sans" font-size="13.5" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
    Engineering predictive ML pipelines &amp; high-performance web apps from concept to production.
  </text>

  <!-- Tech Stack Chips -->
  <g transform="translate(50, 204)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="70" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="35" y="16" class="font-mono" font-size="10.5" font-weight="500" fill="#38bdf8" text-anchor="middle">Python</text>
    </g>
    <!-- PyTorch -->
    <g transform="translate(78, 0)">
      <rect width="75" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="37.5" y="16" class="font-mono" font-size="10.5" font-weight="500" fill="#f97316" text-anchor="middle">PyTorch</text>
    </g>
    <!-- Scikit-Learn -->
    <g transform="translate(161, 0)">
      <rect width="98" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="49" y="16" class="font-mono" font-size="10.5" font-weight="500" fill="#38bdf8" text-anchor="middle">Scikit-Learn</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(267, 0)">
      <rect width="75" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="37.5" y="16" class="font-mono" font-size="10.5" font-weight="500" fill="#ffffff" text-anchor="middle">Next.js</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(350, 0)">
      <rect width="92" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="46" y="16" class="font-mono" font-size="10.5" font-weight="500" fill="#60a5fa" text-anchor="middle">TypeScript</text>
    </g>
    <!-- Flask / APIs -->
    <g transform="translate(450, 0)">
      <rect width="65" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="32.5" y="16" class="font-mono" font-size="10.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">Flask</text>
    </g>
    <!-- Generative AI -->
    <g transform="translate(523, 0)">
      <rect width="118" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#4f46e5" stroke-width="0.8" />
      <text x="59" y="16" class="font-mono" font-size="10.5" font-weight="600" fill="#a78bfa" text-anchor="middle">✦ Generative AI</text>
    </g>
  </g>

  <!-- Right Side Decorative Neural / Network Graphic -->
  <g transform="translate(750, 40)" opacity="0.85">
    <!-- Connecting network lines -->
    <line x1="60" y1="50" x2="130" y2="30" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="60" y1="50" x2="110" y2="100" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="130" y1="30" x2="175" y2="70" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="110" y1="100" x2="175" y2="70" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="110" y1="100" x2="140" y2="150" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="175" y1="70" x2="140" y2="150" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <line x1="60" y1="50" x2="30" y2="120" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="30" y1="120" x2="110" y2="100" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="30" y1="120" x2="70" y2="160" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3" />
    <line x1="70" y1="160" x2="140" y2="150" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.3" />

    <!-- Node circles with glow -->
    <circle cx="60" cy="50" r="4.5" fill="#38bdf8" />
    <circle cx="60" cy="50" r="9" fill="#38bdf8" fill-opacity="0.15" />

    <circle cx="130" cy="30" r="5" fill="#818cf8" />
    <circle cx="130" cy="30" r="10" fill="#818cf8" fill-opacity="0.15" />

    <circle cx="175" cy="70" r="6" fill="#38bdf8" />
    <circle cx="175" cy="70" r="12" fill="#38bdf8" fill-opacity="0.2" />

    <circle cx="110" cy="100" r="4.5" fill="#c084fc" />
    <circle cx="110" cy="100" r="8" fill="#c084fc" fill-opacity="0.2" />

    <circle cx="30" cy="120" r="4" fill="#60a5fa" />
    <circle cx="70" cy="160" r="4.5" fill="#38bdf8" />

    <circle cx="140" cy="150" r="5.5" fill="#818cf8" />
    <circle cx="140" cy="150" r="11" fill="#818cf8" fill-opacity="0.2" />

    <!-- Decorative code bracket / tensor badge -->
    <g transform="translate(80, 8)">
      <rect width="80" height="20" rx="4" fill="#030712" fill-opacity="0.8" stroke="#334155" stroke-width="0.75" />
      <text x="40" y="14" class="font-mono" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">&lt;Tensor /&gt;</text>
    </g>
  </g>
</svg>
