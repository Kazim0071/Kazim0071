<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Subtle elegant linear accent -->
    <linearGradient id="line-accent-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .font-mono { font-family: 'SF Mono', Consolas, 'Fira Code', Menlo, Monaco, monospace; }
  </style>

  <!-- Card Background -->
  <rect width="1000" height="220" rx="10" fill="#ffffff" />
  <rect x="0.5" y="0.5" width="999" height="219" rx="9.5" stroke="#e2e8f0" stroke-width="1" />

  <!-- Subtle Top Accent Rule -->
  <rect x="48" y="24" width="180" height="2" fill="url(#line-accent-light)" />

  <!-- Domain Category Label -->
  <text x="48" y="44" class="font-mono" font-size="11" font-weight="600" fill="#64748b" letter-spacing="1.5">
    MACHINE LEARNING &amp; FULL STACK ENGINEERING
  </text>

  <!-- Name -->
  <text x="48" y="90" class="font-sans" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="-0.5">
    Qasim Amir
  </text>

  <!-- Professional Role & Title -->
  <text x="48" y="122" class="font-sans" font-size="16" font-weight="500" fill="#334155">
    Machine Learning Engineer <tspan fill="#64748b">&amp;</tspan> Full Stack Developer
  </text>

  <!-- Position / Subtitle -->
  <text x="48" y="146" class="font-sans" font-size="13" font-weight="400" fill="#64748b">
    Full Stack Next.js Developer at Alkhidmat Foundation – Digital &nbsp;·&nbsp; Lahore, Pakistan
  </text>

  <!-- Minimal Skill Chips -->
  <g transform="translate(48, 172)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <rect width="68" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="34" y="16" class="font-mono" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Python</text>
    </g>
    <!-- PyTorch -->
    <g transform="translate(76, 0)">
      <rect width="74" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="37" y="16" class="font-mono" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">PyTorch</text>
    </g>
    <!-- Scikit-Learn -->
    <g transform="translate(158, 0)">
      <rect width="98" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="49" y="16" class="font-mono" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Scikit-Learn</text>
    </g>
    <!-- Next.js -->
    <g transform="translate(264, 0)">
      <rect width="72" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="36" y="16" class="font-mono" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Next.js</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(344, 0)">
      <rect width="92" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="46" y="16" class="font-mono" font-size="11" font-weight="600" fill="#2563eb" text-anchor="middle">TypeScript</text>
    </g>
    <!-- Flask / APIs -->
    <g transform="translate(444, 0)">
      <rect width="65" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="32.5" y="16" class="font-mono" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">Flask</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(517, 0)">
      <rect width="90" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.8" />
      <text x="45" y="16" class="font-mono" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">PostgreSQL</text>
    </g>
  </g>

  <!-- Right Side Minimal Neural Architecture Diagram (Clean Academic / Research Style) -->
  <g transform="translate(740, 36)" opacity="0.75">
    <!-- Architecture Frame -->
    <rect x="0" y="0" width="210" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.8" />
    
    <!-- Title inside schematic -->
    <text x="14" y="22" class="font-mono" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1">MODEL PIPELINE</text>
    
    <!-- Schematic Layers -->
    <!-- Input layer -->
    <circle cx="36" cy="50" r="4" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="36" cy="75" r="4" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="36" cy="100" r="4" fill="#2563eb" fill-opacity="0.8" />
    <circle cx="36" cy="125" r="4" fill="#2563eb" fill-opacity="0.8" />
    
    <!-- Hidden layer 1 -->
    <circle cx="85" cy="40" r="4" fill="#94a3b8" />
    <circle cx="85" cy="65" r="4" fill="#94a3b8" />
    <circle cx="85" cy="90" r="4" fill="#94a3b8" />
    <circle cx="85" cy="115" r="4" fill="#94a3b8" />
    <circle cx="85" cy="135" r="4" fill="#94a3b8" />

    <!-- Hidden layer 2 -->
    <circle cx="135" cy="50" r="4" fill="#94a3b8" />
    <circle cx="135" cy="75" r="4" fill="#94a3b8" />
    <circle cx="135" cy="100" r="4" fill="#94a3b8" />
    <circle cx="135" cy="125" r="4" fill="#94a3b8" />

    <!-- Output layer -->
    <circle cx="180" cy="75" r="4.5" fill="#0284c7" />
    <circle cx="180" cy="100" r="4.5" fill="#0284c7" />

    <!-- Sparse clean connector lines -->
    <line x1="36" y1="50" x2="85" y2="40" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="50" x2="85" y2="65" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="75" x2="85" y2="65" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="75" x2="85" y2="90" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="100" x2="85" y2="90" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="100" x2="85" y2="115" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="125" x2="85" y2="115" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="36" y1="125" x2="85" y2="135" stroke="#cbd5e1" stroke-width="0.75" />

    <line x1="85" y1="40" x2="135" y2="50" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="65" x2="135" y2="50" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="65" x2="135" y2="75" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="90" x2="135" y2="75" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="90" x2="135" y2="100" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="115" x2="135" y2="100" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="115" x2="135" y2="125" stroke="#cbd5e1" stroke-width="0.75" />
    <line x1="85" y1="135" x2="135" y2="125" stroke="#cbd5e1" stroke-width="0.75" />

    <line x1="135" y1="50" x2="180" y2="75" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="135" y1="75" x2="180" y2="75" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="135" y1="100" x2="180" y2="100" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.7" />
    <line x1="135" y1="125" x2="180" y2="100" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.7" />
  </g>
</svg>
